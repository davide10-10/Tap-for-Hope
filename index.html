<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Tap for Hope</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script async src="https://adsgram.ai/js/adsgram.js"></script>
</head>
<body>

<div class="app">

    <header class="top">
        <img src="logo.png" class="logo">
        <div class="coins">
            <span id="coins">0</span> 💰
        </div>
    </header>

    <div class="energy-box">
        <span class="energy-icon">⚡</span>
        <div class="energy-bar">
            <div id="energyFill"></div>
        </div>
        <span id="energyText">200</span>
    </div>

    <button id="tapButton" class="heart-btn">❤️</button>

    <div class="buttons">
        <button id="rechargeButton" class="small-btn hidden">Ricarica ⚡</button>
        <button id="leaderboardButton" class="small-btn">Classifica 🏆</button>
        <button id="offersButton" class="small-btn">Offerte 🎁</button>
    </div>

    <div id="leaderboard" class="panel hidden"></div>

    <div id="adsgram"></div>

</div>

<script src="ads.js"></script>
<script src="api.js"></script>
<script src="game.js"></script>

</body>
</html>
